spring.application.name=markets

# Do NOT keep secrets in source. Read API key from env at runtime.
spring.ai.openai.api-key=${OPENAI_API_KEY}
# Chat model (provider-specific). Ensure the provider supports this model name.
spring.ai.openai.chat.options.model=inclusionai/ling-3.0-flash:free
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.vectorstore.pgvector.initialize-schema=true

# Helpful debug logs while diagnosing embedding request failures (remove later)
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client=DEBUG

# Suppress WARN logs from FileSystemFontProvider
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR

spring.docker.compose.lifecycle-management=start_only